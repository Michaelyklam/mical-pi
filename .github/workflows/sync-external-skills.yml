name: Sync External Skills

on:
  schedule:
    - cron: '0 15 * * 1' # every Monday 15:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch
        run: |
          branch="sync-skills/$(date +%Y-%m-%d)"
          echo "branch=$branch" >> "$GITHUB_ENV"
          git checkout -b "$branch"

      - name: Pull updates for each external skill
        id: sync
        run: |
          tmp_root=$(mktemp -d)
          changed=""
          for entry in $(jq -c '.[]' .github/skill-sources.json); do
            name=$(echo "$entry" | jq -r '.name')
            repo=$(echo "$entry" | jq -r '.repo')
            branch_ref=$(echo "$entry" | jq -r '.branch')
            subpath=$(echo "$entry" | jq -r '.subpath // ""')
            before=$(git rev-parse HEAD)

            if [ -z "$subpath" ]; then
              # Skill lives at the repo root - pull directly.
              echo "Syncing $name from $repo@$branch_ref (root)"
              if ! git subtree pull --prefix="$name" "$repo" "$branch_ref" --squash -m "chore(sync): update $name from upstream"; then
                echo "::warning::subtree pull failed for $name, skipping"
                git merge --abort 2>/dev/null || true
                continue
              fi
            else
              # Skill is nested inside a subfolder of a larger repo - clone once per
              # repo, re-extract just that subfolder's history, then pull from it.
              echo "Syncing $name from $repo@$branch_ref ($subpath)"
              clone_key=$(echo "$repo" | md5sum | cut -d' ' -f1)
              clone_dir="$tmp_root/$clone_key"
              if [ ! -d "$clone_dir" ]; then
                git clone --quiet "$repo" "$clone_dir"
              else
                (cd "$clone_dir" && git fetch --quiet origin "$branch_ref")
              fi
              split_branch="split-$name"
              if ! (cd "$clone_dir" && git checkout --quiet "$branch_ref" && git branch -D "$split_branch" 2>/dev/null; git subtree split --prefix="$subpath" -b "$split_branch" "$branch_ref"); then
                echo "::warning::subtree split failed for $name, skipping"
                continue
              fi
              if ! git subtree pull --prefix="$name" "$clone_dir" "$split_branch" --squash -m "chore(sync): update $name from upstream ($subpath)"; then
                echo "::warning::subtree pull failed for $name, skipping"
                git merge --abort 2>/dev/null || true
                continue
              fi
            fi

            after=$(git rev-parse HEAD)
            if [ "$before" != "$after" ]; then
              changed="$changed $name"
            fi
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Push branch
        if: steps.sync.outputs.changed != ''
        run: git push origin "$branch"

      - name: Open PR
        if: steps.sync.outputs.changed != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Sync external skills:${{ steps.sync.outputs.changed }}" \
            --body "Automated sync from upstream sources listed in \`.github/skill-sources.json\`. Review the diff before merging — these are third-party skills." \
            --head "$branch" \
            --base main
